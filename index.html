<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Julián Delgado</title>

    <style>
        body {
            margin: 0;
            background: white;
            color: black;
            font-family: "Georgia", serif;
        }

        header {
            padding: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .title {
            font-size: 22px;
            letter-spacing: 0.5px;
        }

        .buttons button {
            background: none;
            border: none;
            font-size: 15px;
            cursor: pointer;
            padding: 6px 10px;
        }

        /* SINGLE VIEW */
        #single-view {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 0;
        }

        #single-view img {
            max-width: 90%;
            max-height: 80vh;
        }

        /* GRID */
        #grid-view {
            display: none; /* empieza oculto */
            padding: 20px;
            column-count: 3;
            column-gap: 15px;
        }

        #grid-view img {
            width: 100%;
            margin-bottom: 15px;
            cursor: pointer;
            break-inside: avoid;
        }

        /* BIO */
        .bio {
            text-align: center;
            max-width: 700px;
            margin: 60px auto;
            font-size: 15px;
            line-height: 1.6;
            color: #444;
        }
    </style>
</head>

<body>

<header>
    <div class="title">Julián Delgado</div>
    <div class="buttons">
        <button onclick="showSingle()">Single</button>
        <button onclick="showGrid()">Grid</button>
    </div>
</header>

<!-- SINGLE VIEW DEFAULT -->

<!-- BIO -->
<div class="bio">
    Como fotógrafo y artista visual, me dedico a retratar la vida diaria explorando la sensualidad
    y el erotismo en lo cotidiano. Crecí en Remedios de Escalada, donde la fotografía se transformó
    en mi medio para reinterpretar experiencias.
</div>

<script>
    function showSingle() {
        document.getElementById("single-view").style.display = "flex";
        document.getElementById("grid-view").style.display = "none";
    }

    function showGrid() {
        document.getElementById("single-view").style.display = "none";
        document.getElementById("grid-view").style.display = "block";
        window.scrollTo(0, 0);
    }

    function openSingle(src) {
        document.getElementById("single-img").src = src;
        showSingle();
        window.scrollTo(0, 0);
    }
</script>
