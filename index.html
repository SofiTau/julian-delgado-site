<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Julián</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            color: #000;
            font-family: Arial, sans-serif;
        }

        header {
            padding: 20px;
        }

        h1 {
            margin: 0;
            font-size: 28px;
            font-weight: bold;
        }

        /* Botones */
        .view-buttons {
            padding-left: 20px;
            margin-top: 5px;
        }

        button {
            padding: 6px 10px;
            margin-right: 5px;
            cursor: pointer;
        }

        /* SINGLE VIEW */
        #single-view {
            width: 100%;
            height: calc(100vh - 120px);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #single-view img {
            max-width: 95%;
            max-height: 95%;
            object-fit: contain;
        }

        /* GRID */
        #grid-view {
            display: none;
            padding: 20px;
            column-count: 3;
            column-gap: 10px;
        }

        #grid-view img {
            width: 100%;
            margin-bottom: 10px;
            cursor: pointer;
            break-inside: avoid-column;
        }

        /* BIO */
        .bio {
            max-width: 700px;
            margin: 40px auto;
            padding: 0 20px;
            text-align: center;
            font-size: 15px;
            line-height: 1.6;
            color: #444;
        }
    </style>
</head>

<body>

<header>
    <h1>Julián</h1>
</header>

<div class="view-buttons">
    <button onclick="showSingle()">Single View</button>
    <button onclick="showGrid()">Grid View</button>
</div>

<!-- BIO -->
<div class="bio">
    Como fotógrafo y artista visual, me dedico a retratar la vida diaria explorando la sensualidad
    y el erotismo en lo cotidiano. Crecí en Remedios de Escalada, donde la fotografía se transformó
    en mi medio para reinterpretar experiencias.
</div>

<script>
    const singleView = document.getElementById("single-view");
    const gridView = document.getElementById("grid-view");
    const singleImg = document.getElementById("single-img");

    function showSingle() {
        singleView.style.display = "flex";
        gridView.style.display = "none";
        window.scrollTo(0, 0);
    }

    function showGrid() {
        singleView.style.display = "none";
        gridView.style.display = "block";
        window.scrollTo(0, 0);
    }

    function openSingle(src) {
        singleImg.src = src;
        showSingle();
    }
</script>
