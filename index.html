<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Julián – Fotografía</title>
    <link rel="stylesheet" href="styles.css" />

    <style>
        body {
            margin: 0;
            background: #111;
            color: #fff;
            font-family: Arial, sans-serif;
        }

        header {
            padding: 20px;
            text-align: center;
        }

        h1 {
            margin: 0;
            font-weight: 300;
            letter-spacing: 1px;
        }

        /* --- SINGLE VIEW --- */
        #single-view {
            width: 100%;
            height: calc(100vh - 120px);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #single-view img {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
        }

        /* --- GRID VIEW --- */
        #grid-view {
            display: none; /* oculto por defecto */
            padding: 20px;
            column-count: 3;
            column-gap: 15px;
        }

        #grid-view img {
            width: 100%;
            margin-bottom: 15px;
            break-inside: avoid;
            cursor: pointer;
        }

        /* --- BOTONES --- */
        .view-buttons {
            text-align: center;
            margin-top: 10px;
        }

        button {
            background: #333;
            border: none;
            padding: 10px 15px;
            color: #fff;
            cursor: pointer;
            margin: 0 5px;
        }

        button:hover {
            background: #555;
        }

        /* --- BIO --- */
        .bio {
            max-width: 700px;
            margin: 40px auto;
            padding: 0 20px;
            text-align: center;
            font-size: 15px;
            line-height: 1.6;
            color: #ccc;
        }
    </style>
</head>

<body>

<header>

<div class="bio">
    Como fotógrafo y artista visual, me dedico a retratar la vida diaria explorando la sensualidad
    y el erotismo en lo cotidiano. Crecí en Remedios de Escalada, donde la fotografía se transformó
    en mi medio para reinterpretar experiencias.
</div>

<script>
    const singleView = document.getElementById("single-view");
    const gridView = document.getElementById("grid-view");
    const singleImg = document.getElementById("single-img");

    function showSingle() {
        singleView.style.display = "flex";
        gridView.style.display = "none";
    }

    function showGrid() {
        singleView.style.display = "none";
        gridView.style.display = "block";
    }

    function openSingle(src) {
        singleImg.src = src;
        showSingle();
        window.scrollTo(0, 0);
    }
</script>
